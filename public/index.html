<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>핑거 다이스 - VIP 베팅룸</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: radial-gradient(circle at 50% 50%, #1e272e, #000000); color: #fff; font-family: 'Noto Sans KR', sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; touch-action: manipulation; transition: background 0.5s; }
        .screen { display: none; width: 90%; max-width: 400px; animation: fadeIn 0.5s ease-out; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input { padding: 15px; font-size: 20px; border-radius: 12px; border: 2px solid #f39c12; background: rgba(0,0,0,0.5); color: #f1c40f; width: 80%; margin-bottom: 30px; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 10px rgba(243, 156, 18, 0.3); box-sizing: border-box; transition: 0.3s; }
        input:focus { box-shadow: 0 0 20px rgba(243, 156, 18, 0.8); }
        button { padding: 15px 30px; font-size: 20px; background: linear-gradient(135deg, #f39c12, #d35400); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 900; width: 100%; box-shadow: 0 5px 20px rgba(211, 84, 0, 0.5); box-sizing: border-box; text-transform: uppercase; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .finger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; justify-items: center; }
        .finger-btn { background: #2c3e50; border: 4px dashed #34495e; border-radius: 50%; width: 80px; height: 80px; font-size: 28px; padding: 0; box-shadow: 0 10px 20px rgba(0,0,0,0.5); color: #ecf0f1; transition: all 0.2s; }
        .finger-btn:active { background: #f39c12; border-color: #fff; color: #000; box-shadow: 0 0 20px #f39c12; transform: scale(0.9); }
        .title { color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); font-weight: 900; letter-spacing: 2px; }
        .subtitle { color: #bdc3c7; font-size: 16px; margin-bottom: 40px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen active">
        <h1 class="title" style="font-size: 32px; margin-bottom:10px;">LIAR'S DICE</h1>
        <p class="subtitle">블러핑 베팅 게임에 오신 것을 환영합니다</p>
        <input type="text" id="nicknameInput" placeholder="당신의 닉네임">
        <button id="joinBtn">테이블 입장</button>
    </div>

    <div id="waitScreen" class="screen">
        <div class="loader" style="font-size: 50px; margin-bottom: 20px; animation: spin 2s linear infinite;">⏳</div>
        <h2 id="waitMessage" style="color: #3498db; line-height: 1.5; text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);">전광판을 보고 대기하세요...</h2>
    </div>

    <div id="fingerScreen" class="screen">
        <h2 class="title">손가락 개수 확정 (LOCK)</h2>
        <p class="subtitle" style="color: #e74c3c; font-weight: bold;">남들이 보지 못하게 몰래 선택하세요</p>
        <div class="finger-grid">
            <button class="finger-btn" onclick="submitFingers(0)">0</button>
            <button class="finger-btn" onclick="submitFingers(1)">1</button>
            <button class="finger-btn" onclick="submitFingers(2)">2</button>
            <button class="finger-btn" onclick="submitFingers(3)">3</button>
            <button class="finger-btn" onclick="submitFingers(4)">4</button>
            <button class="finger-btn" onclick="submitFingers(5)">5</button>
        </div>
    </div>

    <div id="bettingScreen" class="screen">
        <h2 class="title">총합 예측 베팅</h2>
        <p class="subtitle">이 방의 전체 손가락 합은 몇 개일까요?</p>
        <input type="number" id="betInput" placeholder="숫자 입력 (예: 15)" min="0">
        <button id="betBtn" style="background: linear-gradient(135deg, #27ae60, #2ecc71); box-shadow: 0 5px 20px rgba(46, 204, 113, 0.5);">예측 베팅하기</button>
    </div>

    <div id="resultScreen" class="screen">
        <h2 style="color: #ecf0f1; letter-spacing: 5px;">RESULT</h2>
        <div id="myResult" style="margin: 30px 0; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);"></div>
        <button onclick="switchScreen('waitScreen')" style="background: #34495e; box-shadow: none;">대기 화면으로</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.body.style.background = 'radial-gradient(circle at 50% 50%, #1e272e, #000000)'; 
        }

        document.getElementById('joinBtn').addEventListener('click', () => {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if(nickname) {
                socket.emit('join', nickname);
                switchScreen('waitScreen');
            } else {
                alert("닉네임을 입력해주세요!");
            }
        });

        // ⭐ 서버에서 상태와 함께 플레이어 정보를 보내줌
        socket.on('phaseChange', (phase, playersData) => {
            const me = playersData[socket.id];
            
            // ⭐ 중간 합류자로 판단되면(active: false) 입력 화면으로 넘어가지 않고 대기시킴
            if (me && !me.active && phase !== 'lobby' && phase !== 'reveal') {
                document.getElementById('waitMessage').innerHTML = `<span style="color:#e74c3c;">현재 게임이 진행 중입니다.</span><br><br>이번 라운드는 관전하시고,<br>다음 라운드부터 자동 참여됩니다!`;
                switchScreen('waitScreen');
                return;
            }

            if(phase === 'input_fingers') {
                document.getElementById('waitMessage').innerText = "다른 플레이어의 선택을 기다리는 중...";
                switchScreen('fingerScreen');
            }
            if(phase === 'betting') {
                document.getElementById('betInput').value = '';
                switchScreen('bettingScreen');
            }
        });

        window.submitFingers = function(num) {
            socket.emit('submitFingers', num);
            document.getElementById('waitMessage').innerText = "다른 플레이어의 선택을 기다리는 중...";
            switchScreen('waitScreen');
        }

        document.getElementById('betBtn').addEventListener('click', () => {
            const betVal = parseInt(document.getElementById('betInput').value);
            if(!isNaN(betVal) && betVal >= 0) {
                socket.emit('submitBet', betVal);
                document.getElementById('waitMessage').innerText = "모든 베팅이 끝날 때까지 대기하세요...";
                switchScreen('waitScreen');
            } else {
                alert("정확한 숫자를 입력해주세요!");
            }
        });

        socket.on('revealResult', (data) => {
            switchScreen('resultScreen');
            
            const myData = data.players[socket.id];
            
            // ⭐ 관전자 전용 결과 화면
            if (!myData.active) {
                document.getElementById('myResult').innerHTML = `<div style="font-size: 20px; color: #bdc3c7;">이번 라운드는 관전하셨습니다.<br><br>잠시 후 <span style="color:#f1c40f">다음 라운드</span>부터<br>참여하실 수 있습니다!</div>`;
                return;
            }

            const isWinner = myData.betTotal === data.trueTotal;
            let resultHtml = `<div style="font-size: 18px; color: #95a5a6;">실제 총합</div><div style="font-size: 60px; color: #fff; font-weight: 900; text-shadow: 0 0 20px #fff; margin: 10px 0;">${data.trueTotal}</div>`;
            
            if (isWinner) {
                resultHtml += `<div style="color: #f1c40f; font-size: 24px; font-weight: bold; margin-top: 20px;">🎉 JACKPOT! 정답입니다! 🎉<br><span style="color:#2ecc71; font-size: 18px;">+1점 획득</span></div>`;
                document.body.style.background = 'radial-gradient(circle at 50% 50%, #5b4000, #000000)'; 
            } else {
                resultHtml += `<div style="color: #e74c3c; font-size: 20px; margin-top: 20px; font-weight: bold;">베팅 실패...<br><span style="font-size: 16px; color: #7f8c8d; font-weight: normal;">(나의 예측: ${myData.betTotal})</span></div>`;
            }
            
            document.getElementById('myResult').innerHTML = resultHtml;
        });
    </script>
</body>
</html>
