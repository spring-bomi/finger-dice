<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>핑거 주사위 눈치게임 - 플레이어</title>
    <style>
        body { margin: 0; background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; touch-action: manipulation; }
        .screen { display: none; width: 90%; max-width: 400px; }
        .active { display: block; }
        
        input { padding: 15px; font-size: 20px; border-radius: 10px; border: none; width: 80%; margin-bottom: 20px; text-align: center; font-weight: bold; box-sizing: border-box;}
        button { padding: 15px 30px; font-size: 20px; background-color: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); box-sizing: border-box;}
        
        .finger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .finger-btn { background-color: #3498db; height: 80px; font-size: 24px; padding: 0;}
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="loginScreen" class="screen active">
        <h1 style="margin-bottom:30px;">🤞 핑거 다이스</h1>
        <input type="text" id="nicknameInput" placeholder="당신의 이름은?">
        <button id="joinBtn">입장하기</button>
    </div>

    <!-- 2. 대기 화면 -->
    <div id="waitScreen" class="screen">
        <h2 id="waitMessage">전광판을 보고 대기하세요...</h2>
    </div>

    <!-- 3. 손가락 개수 입력 화면 -->
    <div id="fingerScreen" class="screen">
        <h2>손가락을 몇 개 낼까요?</h2>
        <p style="color: #f1c40f; margin-bottom: 30px;">몰래 선택하세요!</p>
        <div class="finger-grid">
            <button class="finger-btn" onclick="submitFingers(0)">0개</button>
            <button class="finger-btn" onclick="submitFingers(1)">1개</button>
            <button class="finger-btn" onclick="submitFingers(2)">2개</button>
            <button class="finger-btn" onclick="submitFingers(3)">3개</button>
            <button class="finger-btn" onclick="submitFingers(4)">4개</button>
            <button class="finger-btn" onclick="submitFingers(5)">5개</button>
        </div>
    </div>

    <!-- 4. 베팅 입력 화면 -->
    <div id="bettingScreen" class="screen">
        <h2>전체 손가락 총합 예측</h2>
        <p style="margin-bottom: 30px;">내 손가락을 포함한 전체 합은 얼마일까요?</p>
        <input type="number" id="betInput" placeholder="예: 22" min="0">
        <button id="betBtn">예측 베팅하기!</button>
    </div>

    <!-- 5. 결과 화면 -->
    <div id="resultScreen" class="screen">
        <h2>결과 공개!</h2>
        <h1 id="myResult" style="font-size: 30px; color: #f1c40f; margin: 30px 0;"></h1>
        <p>전광판을 확인하세요!</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 입장 처리
        document.getElementById('joinBtn').addEventListener('click', () => {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if(nickname) {
                socket.emit('join', nickname);
                switchScreen('waitScreen');
            } else {
                alert("이름을 입력해주세요!");
            }
        });

        // 단계 변경 수신
        socket.on('phaseChange', (phase) => {
            if(phase === 'input_fingers') switchScreen('fingerScreen');
            if(phase === 'betting') switchScreen('bettingScreen');
        });

        // 손가락 제출
        window.submitFingers = function(num) {
            socket.emit('submitFingers', num);
            document.getElementById('waitMessage').innerText = "다른 사람들을 기다리는 중...";
            switchScreen('waitScreen');
        }

        // 베팅 제출
        document.getElementById('betBtn').addEventListener('click', () => {
            const betVal = parseInt(document.getElementById('betInput').value);
            if(!isNaN(betVal) && betVal >= 0) {
                socket.emit('submitBet', betVal);
                document.getElementById('waitMessage').innerText = "결과 집계 중...";
                switchScreen('waitScreen');
            } else {
                alert("정확한 숫자를 입력해주세요!");
            }
        });

        // 결과 공개
        socket.on('revealResult', (data) => {
            switchScreen('resultScreen');
            document.getElementById('myResult').innerText = `실제 총합: ${data.trueTotal}개`;
        });
    </script>
</body>
</html>
