<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>핑거 다이스 - VIP 베팅룸</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background: radial-gradient(circle at 50% 50%, #1e272e, #000000); color: #fff; font-family: 'Noto Sans KR', sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; touch-action: manipulation; transition: background 0.5s; overflow: hidden; }
        .screen { display: none; width: 90%; max-width: 400px; animation: fadeIn 0.5s ease-out; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input { padding: 15px; font-size: 20px; border-radius: 12px; border: 2px solid #f39c12; background: rgba(0,0,0,0.5); color: #f1c40f; width: 80%; margin-bottom: 20px; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 10px rgba(243, 156, 18, 0.3); box-sizing: border-box; transition: 0.3s; }
        input:focus { box-shadow: 0 0 20px rgba(243, 156, 18, 0.8); }
        button { padding: 15px 30px; font-size: 20px; background: linear-gradient(135deg, #f39c12, #d35400); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 900; width: 100%; box-shadow: 0 5px 20px rgba(211, 84, 0, 0.5); box-sizing: border-box; text-transform: uppercase; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        
        .finger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 15px; justify-items: center; }
        .finger-btn { background: #2c3e50; border: 4px dashed #34495e; border-radius: 50%; width: 80px; height: 80px; font-size: 28px; padding: 0; box-shadow: 0 10px 20px rgba(0,0,0,0.5); color: #ecf0f1; transition: all 0.2s; }
        .finger-btn:active, .finger-btn.ai-selected { background: #f39c12; border-color: #fff; color: #000; box-shadow: 0 0 20px #f39c12; transform: scale(0.9); }
        .title { color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); font-weight: 900; letter-spacing: 2px; }
        .subtitle { color: #bdc3c7; font-size: 16px; margin-bottom: 30px; }

        /* ⭐ 카메라 및 AI 인식 UI */
        #webcam { position: absolute; top: 15px; right: 15px; width: 120px; height: 90px; border-radius: 10px; z-index: 50; transform: scaleX(-1); border: 2px solid #2ecc71; box-shadow: 0 5px 15px rgba(0,0,0,0.5); background-color: #000; display: none; }
        #aiStatus { font-size: 14px; color: #2ecc71; margin-bottom: 20px; font-weight: bold; background: rgba(46, 204, 113, 0.1); padding: 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div id="loginScreen" class="screen active">
        <h1 class="title" style="font-size: 32px; margin-bottom:10px;">LIAR'S DICE</h1>
        <p class="subtitle">블러핑 베팅 게임에 오신 것을 환영합니다</p>
        <input type="text" id="nicknameInput" placeholder="당신의 닉네임">
        <button id="joinBtn">테이블 입장</button>
    </div>

    <div id="waitScreen" class="screen">
        <div class="loader" style="font-size: 50px; margin-bottom: 20px; animation: spin 2s linear infinite;">⏳</div>
        <h2 id="waitMessage" style="color: #3498db; line-height: 1.5; text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);">대기 중...</h2>
    </div>

    <div id="fingerScreen" class="screen">
        <h2 class="title">손가락 개수 확정 (LOCK)</h2>
        <p class="subtitle" style="color: #e74c3c; font-weight: bold;">카메라에 손을 보여 1.5초간 유지하세요</p>
        
        <div id="aiStatus">✋ AI 카메라 인식 대기 중...</div>

        <div class="finger-grid">
            <button class="finger-btn" id="btn-0" onclick="submitFingers(0)">0</button>
            <button class="finger-btn" id="btn-1" onclick="submitFingers(1)">1</button>
            <button class="finger-btn" id="btn-2" onclick="submitFingers(2)">2</button>
            <button class="finger-btn" id="btn-3" onclick="submitFingers(3)">3</button>
            <button class="finger-btn" id="btn-4" onclick="submitFingers(4)">4</button>
            <button class="finger-btn" id="btn-5" onclick="submitFingers(5)">5</button>
        </div>
        <p style="color: #7f8c8d; font-size: 12px; margin-top: 10px;">* 버튼을 직접 터치해서 확정할 수도 있습니다.</p>
    </div>

    <div id="bettingScreen" class="screen">
        <h2 class="title">총합 예측 베팅</h2>
        <p class="subtitle">이 방의 전체 손가락 합은 몇 개일까요?</p>
        
        <input type="number" id="betTotalInput" placeholder="예측 총합 (예: 15)" min="0">
        
        <div id="betAmountSection" style="display: none; margin-top: 10px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.2);">
            <p style="color: #2ecc71; margin-bottom: 10px; font-weight: bold;">나의 보유 칩: 💰<span id="myCurrentScore">0</span></p>
            <input type="number" id="betAmountInput" placeholder="얼마를 걸겠습니까?" min="0">
            <p style="color: #95a5a6; font-size: 12px; margin-top:-10px; margin-bottom: 20px;">* 정답 시 3배당 획득, 오답 시 베팅금 몰수</p>
        </div>

        <button id="betBtn" style="background: linear-gradient(135deg, #27ae60, #2ecc71); box-shadow: 0 5px 20px rgba(46, 204, 113, 0.5);">확정하기</button>
    </div>

    <div id="resultScreen" class="screen">
        <h2 style="color: #ecf0f1; letter-spacing: 5px;">RESULT</h2>
        <div id="myResult" style="margin: 30px 0; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);"></div>
        <button onclick="document.getElementById('waitMessage').innerHTML='다음 라운드를 준비하는 중입니다...<br><br><span style=\'font-size:16px; color:#f1c40f;\'>전광판을 확인해주세요.</span>'; switchScreen('waitScreen');" style="background: #34495e; box-shadow: none;">대기 화면으로</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('webcam');
        const aiStatus = document.getElementById('aiStatus');
        
        let currentMode = 'score';
        let myScore = 0;
        let isCameraRunning = false;
        
        // ⭐ AI 손가락 인식 유지용 변수
        let stableFingerCount = -1;
        let stableTimer = null;
        let isPhaseInput = false;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.body.style.background = 'radial-gradient(circle at 50% 50%, #1e272e, #000000)'; 
            
            // 카메라 화면은 손가락 확정 단계에서만 노출
            if (screenId === 'fingerScreen') {
                videoElement.style.display = 'block';
                isPhaseInput = true;
            } else {
                videoElement.style.display = 'none';
                isPhaseInput = false;
                clearTimeout(stableTimer);
            }
        }

        document.getElementById('joinBtn').addEventListener('click', () => {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if(nickname) {
                socket.emit('join', nickname);
                document.getElementById('waitMessage').innerHTML = `입장 완료!<br><br><span style="font-size:16px; color:#f1c40f;">호스트가 게임 모드를 선택할 때까지<br>기다려주세요.</span>`;
                switchScreen('waitScreen');
                startCamera(); // 권한 획득을 위해 로그인 시 카메라 시작
            } else { alert("닉네임을 입력해주세요!"); }
        });

        // 🟢 [AI 로직] 카메라 시작 및 손가락 계산
        function startCamera() {
            if (isCameraRunning) return;
            isCameraRunning = true;

            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (!isPhaseInput) return;

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    let count = 0;

                    // 검지, 중지, 약지, 새끼: 끝 마디(Tip)가 아래 마디(PIP)보다 위(y값이 작음)에 있으면 펴진 것
                    if (landmarks[8].y < landmarks[6].y) count++;
                    if (landmarks[12].y < landmarks[10].y) count++;
                    if (landmarks[16].y < landmarks[14].y) count++;
                    if (landmarks[20].y < landmarks[18].y) count++;

                    // 엄지: 엄지 끝(4)이 새끼손가락 밑단(17)에서 멀리 떨어져 있으면 펴진 것
                    const distTip = Math.hypot(landmarks[4].x - landmarks[17].x, landmarks[4].y - landmarks[17].y);
                    const distBase = Math.hypot(landmarks[2].x - landmarks[17].x, landmarks[2].y - landmarks[17].y);
                    if (distTip > distBase * 1.2) count++;

                    count = Math.min(count, 5); // 혹시 모를 오차 방지 최대 5

                    // UI 시각 효과 반영
                    document.querySelectorAll('.finger-btn').forEach(btn => btn.classList.remove('ai-selected'));
                    document.getElementById(`btn-${count}`).classList.add('ai-selected');

                    // 일정한 숫자가 1.5초간 유지되면 자동 제출 (흔들림 방지)
                    if (stableFingerCount !== count) {
                        stableFingerCount = count;
                        aiStatus.innerText = `✋ 인식된 손가락: ${count}개 (그대로 유지하세요!)`;
                        clearTimeout(stableTimer);
                        
                        stableTimer = setTimeout(() => {
                            if (isPhaseInput) {
                                aiStatus.innerText = `✅ ${count}개 확정 완료!`;
                                submitFingers(count);
                            }
                        }, 1500);
                    }
                } else {
                    // 손이 안 보일 때 초기화
                    document.querySelectorAll('.finger-btn').forEach(btn => btn.classList.remove('ai-selected'));
                    aiStatus.innerText = "✋ 화면에 손을 보여주세요";
                    stableFingerCount = -1;
                    clearTimeout(stableTimer);
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start();
        }

        socket.on('phaseChange', (phase, playersData, mode) => {
            currentMode = mode;
            const me = playersData[socket.id];
            
            if (phase === 'lobby') {
                document.getElementById('waitMessage').innerHTML = `대기실 입장<br><br><span style="font-size:16px; color:#f1c40f;">호스트가 게임 모드를 선택할 때까지<br>기다려주세요.</span>`;
                if(me && !document.getElementById('loginScreen').classList.contains('active')) {
                    switchScreen('waitScreen');
                }
                return;
            }

            if (me && !me.active && phase !== 'reveal') {
                document.getElementById('waitMessage').innerHTML = `<span style="color:#e74c3c;">현재 라운드가 진행 중입니다.</span><br><br><span style="font-size:16px; color:#bdc3c7;">이번 판은 관전하시고,<br>다음 라운드부터 자동 참여됩니다!</span>`;
                switchScreen('waitScreen');
                return;
            }

            if(phase === 'input_fingers') {
                // 초기화 후 진입
                stableFingerCount = -1;
                clearTimeout(stableTimer);
                document.querySelectorAll('.finger-btn').forEach(btn => btn.classList.remove('ai-selected'));
                aiStatus.innerText = "✋ AI 카메라 인식 대기 중...";
                switchScreen('fingerScreen');
            }
            if(phase === 'betting') {
                document.getElementById('betTotalInput').value = '';
                document.getElementById('betAmountInput').value = '';
                
                if (currentMode === 'betting') {
                    myScore = me.score;
                    document.getElementById('myCurrentScore').innerText = myScore;
                    document.getElementById('betAmountSection').style.display = 'block';
                } else {
                    document.getElementById('betAmountSection').style.display = 'none';
                }
                switchScreen('bettingScreen');
            }
        });

        // 수동 버튼 터치 또는 AI 인식 완료 시 호출
        window.submitFingers = function(num) {
            isPhaseInput = false; // 제출 후 즉시 인식 중단
            clearTimeout(stableTimer);
            socket.emit('submitFingers', num);
            document.getElementById('waitMessage').innerHTML = `선택 완료!<br><br><span style="font-size:16px; color:#bdc3c7;">다른 플레이어들이 손가락을<br>고민하고 있습니다...</span>`;
            switchScreen('waitScreen');
        }

        document.getElementById('betBtn').addEventListener('click', () => {
            const betTotal = parseInt(document.getElementById('betTotalInput').value);
            let betAmount = 0;
            
            if(isNaN(betTotal) || betTotal < 0) {
                alert("정확한 예측 숫자를 입력해주세요!");
                return;
            }

            if (currentMode === 'betting') {
                betAmount = parseInt(document.getElementById('betAmountInput').value);
                if (isNaN(betAmount) || betAmount < 0 || betAmount > myScore) {
                    alert(`올바른 베팅 금액을 입력하세요.\n(현재 보유 칩: ${myScore} 이하)`);
                    return;
                }
            }

            socket.emit('submitBet', { total: betTotal, amount: betAmount });
            document.getElementById('waitMessage').innerHTML = `예측 완료!<br><br><span style="font-size:16px; color:#bdc3c7;">모든 플레이어가 베팅을 마칠 때까지<br>대기하세요...</span>`;
            switchScreen('waitScreen');
        });

        socket.on('revealResult', (data) => {
            switchScreen('resultScreen');
            const myData = data.players[socket.id];
            
            if (!myData.active) {
                document.getElementById('myResult').innerHTML = `<div style="font-size: 20px; color: #bdc3c7;">이번 라운드는 관전하셨습니다.<br><br>잠시 후 <span style="color:#f1c40f">다음 라운드</span>부터<br>참여하실 수 있습니다!</div>`;
                return;
            }

            const isWinner = myData.betTotal === data.trueTotal;
            let resultHtml = `<div style="font-size: 18px; color: #95a5a6;">실제 총합</div><div style="font-size: 60px; color: #fff; font-weight: 900; text-shadow: 0 0 20px #fff; margin: 10px 0;">${data.trueTotal}</div>`;
            
            if (isWinner) {
                let rewardText = data.roundMode === 'score' ? '+1점 획득!' : `💰 +${myData.betAmount * 3} 획득! (본전 포함)`;
                resultHtml += `<div style="color: #f1c40f; font-size: 24px; font-weight: bold; margin-top: 20px;">🎉 JACKPOT! 정답입니다! 🎉<br><span style="color:#2ecc71; font-size: 18px;">${rewardText}</span></div>`;
                document.body.style.background = 'radial-gradient(circle at 50% 50%, #5b4000, #000000)'; 
            } else {
                let loseText = data.roundMode === 'score' ? '(나의 예측: ' + myData.betTotal + ')' : `베팅 금액 💰${myData.betAmount} 몰수`;
                resultHtml += `<div style="color: #e74c3c; font-size: 20px; margin-top: 20px; font-weight: bold;">베팅 실패...<br><span style="font-size: 16px; color: #7f8c8d; font-weight: normal;">${loseText}</span></div>`;
            }
            
            document.getElementById('myResult').innerHTML = resultHtml;
        });
    </script>
</body>
</html>
