<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 전광판 - VIP 베팅 보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #0f0f1a); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
        h1 { color: #fff; font-size: 3.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px #00d2d3, 0 0 40px #00d2d3; }
        #statusTitle { font-size: 1.8rem; margin-bottom: 20px; color: #c8d6e5; text-align: center; background: rgba(255,255,255,0.05); padding: 10px 30px; border-radius: 30px; backdrop-filter: blur(5px); }
        
        /* ⭐ 새로 추가된 튜토리얼 박스 스타일 */
        #tutorialBox {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed #00d2d3;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 800px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .tutorial-title { color: #00d2d3; font-size: 24px; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0, 210, 211, 0.5); }
        .tutorial-text { color: #ecf0f1; font-size: 20px; line-height: 1.6; margin: 5px 0; }
        .highlight { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.2); padding: 2px 8px; border-radius: 5px; }

        #playerBoard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 95%; max-height: 50vh; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        
        .player-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 25px 20px; border-radius: 20px; text-align: center; width: 230px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.4s; position: relative; overflow: hidden; }
        .spectator-card { opacity: 0.5; filter: grayscale(50%); }
        .winner-card { background: rgba(241, 196, 15, 0.15); border: 2px solid #f1c40f; box-shadow: 0 0 30px rgba(241, 196, 15, 0.6), inset 0 0 20px rgba(241, 196, 15, 0.2); transform: scale(1.1); z-index: 10; }
        .winner-card::before { 
            content: 'WINNER'; 
            position: absolute; 
            top: 15px; 
            right: -40px; 
            width: 150px;
            text-align: center;
            background: #e74c3c; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 900; 
            padding: 5px 0; 
            transform: rotate(45deg); 
            box-shadow: 0 5px 10px rgba(0,0,0,0.4); 
            z-index: 10;
        }
        
        .player-name { font-size: 26px; font-weight: 900; margin-bottom: 15px; color: #fff; }
        .score-badge { font-size: 20px; background: #f39c12; color: #000; padding: 2px 10px; border-radius: 20px; margin-left: 10px; vertical-align: middle; box-shadow: 0 0 10px #f39c12; }
        .player-state { font-size: 18px; color: #00d2d3; font-weight: bold; line-height: 1.6; }
        
        .action-container { display: none; gap: 20px; margin-top: 30px; }
        .btn-score, .btn-next { padding: 20px 40px; font-size: 22px; background: transparent; color: #3498db; border: 2px solid #3498db; border-radius: 50px; cursor: pointer; font-weight: 900; transition: all 0.3s; box-shadow: 0 0 15px rgba(52, 152, 219, 0.3); }
        .btn-score:hover, .btn-next:hover { background: #3498db; color: #000; box-shadow: 0 0 30px #3498db; }
        .btn-betting, .btn-end { padding: 20px 40px; font-size: 22px; background: transparent; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 50px; cursor: pointer; font-weight: 900; transition: all 0.3s; box-shadow: 0 0 15px rgba(231, 76, 60, 0.3); }
        .btn-betting:hover, .btn-end:hover { background: #e74c3c; color: #fff; box-shadow: 0 0 30px #e74c3c; }

        #trueTotalDisplay { font-size: 6rem; color: #fff; display: none; margin-top: 20px; font-weight: 900; text-shadow: 0 0 30px #f1c40f, 0 0 60px #e74c3c; letter-spacing: 5px; }
    </style>
</head>
<body>

    <h1>Liar's Dice</h1>
    <div id="statusTitle">플레이어 입장을 기다리고 있습니다</div>

    <div id="tutorialBox">
        <div class="tutorial-title">📖 게임 방법 📖</div>
        <div class="tutorial-text">참가자들이 낸 손가락의 총합을 정확히 맞혀 칩을 따내는 심리 베팅 게임!</div>
        <div class="tutorial-text">카메라에 비밀리에 <span class="highlight">0~5개의 손가락</span>을 1.5초간 보여주어 락(LOCK)을 건 뒤,<br>스마트폰 화면에서 <span class="highlight">전체 합을 예측</span>해 베팅하세요.</div>
    </div>

    <div id="playerBoard"></div>
    <div id="trueTotalDisplay"></div>

    <div id="startButtons" class="action-container">
        <button class="btn-score" onclick="startGame('score')">점수제 시작</button>
        <button class="btn-betting" onclick="startGame('betting')">베팅제 시작</button>
    </div>

    <div id="nextButtons" class="action-container">
        <button class="btn-next" onclick="nextRound()">다음 라운드 시작</button>
        <button class="btn-end" onclick="endGame()">게임 종료 (모드 변경)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('join', 'DISPLAY');

        const statusTitle = document.getElementById('statusTitle');
        const playerBoard = document.getElementById('playerBoard');
        const startButtons = document.getElementById('startButtons');
        const nextButtons = document.getElementById('nextButtons');
        const trueTotalDisplay = document.getElementById('trueTotalDisplay');
        const tutorialBox = document.getElementById('tutorialBox'); // 튜토리얼 박스

        let currentPhase = 'lobby';
        let currentMode = 'score';

        function renderPlayers(players, trueTotal = null) {
            playerBoard.innerHTML = '';
            for (const id in players) {
                const p = players[id];
                let stateText = '<span style="color:#7f8c8d">대기 중</span>';
                let cardClass = 'player-card'; 
                let scoreDisplay = currentMode === 'betting' ? `💰${p.score}` : `★${p.score}`;
                
                if (!p.active) {
                    stateText = '<span style="color:#95a5a6; font-size: 16px;">다음 라운드 합류 ⏳</span>';
                    cardClass = 'player-card spectator-card';
                } else {
                    if (currentPhase === 'input_fingers') {
                        stateText = p.fingers !== null ? '<span style="color:#2ecc71">LOCK 완료</span>' : '<span style="color:#f39c12; animation: blink 1s infinite;">결정 중...</span>';
                    } else if (currentPhase === 'betting') {
                        stateText = p.betTotal !== null ? '<span style="color:#2ecc71">BET 완료</span>' : '<span style="color:#f39c12; animation: blink 1s infinite;">베팅 중...</span>';
                    } else if (currentPhase === 'reveal') {
                        let betInfo = currentMode === 'betting' ? ` (💰${p.betAmount})` : '';
                        if (p.betTotal === trueTotal) {
                            stateText = `<span style="color:#ecf0f1">손가락: ${p.fingers}개</span><br><span style="color:#f1c40f; font-size:22px;">예측: ${p.betTotal}${betInfo}</span>`;
                            cardClass = 'player-card winner-card';
                        } else {
                            stateText = `<span style="color:#95a5a6">손가락: ${p.fingers}개</span><br><span style="color:#e74c3c">예측: ${p.betTotal}${betInfo}</span>`;
                        }
                    }
                }

                playerBoard.innerHTML += `
                    <div class="${cardClass}">
                        <div class="player-name">${p.name} <span class="score-badge">${scoreDisplay}</span></div>
                        <div class="player-state">${stateText}</div>
                    </div>
                `;
            }
        }

        socket.on('updatePlayers', (players, mode) => {
            currentMode = mode || 'score';
            if (currentPhase === 'lobby') {
                statusTitle.innerText = `현재 ${Object.keys(players).length}명의 플레이어가 대기 중입니다`;
            }
            renderPlayers(players);
        });

        socket.on('playerUpdated', (players, mode) => {
            currentMode = mode || 'score';
            renderPlayers(players);
        });

        socket.on('phaseChange', (phase, players, mode) => {
            currentPhase = phase;
            currentMode = mode || 'score';
            trueTotalDisplay.style.display = 'none';
            
            // ⭐ 상태에 따른 UI 제어 (튜토리얼 박스 숨김/표시 포함)
            if (phase === 'lobby') {
                statusTitle.innerText = "게임 모드를 선택해주세요";
                tutorialBox.style.display = 'block'; // 로비일 때 튜토리얼 보이기
                startButtons.style.display = 'flex';
                nextButtons.style.display = 'none';
            } else if (phase === 'input_fingers') {
                statusTitle.innerText = "비밀리에 손가락 개수를 결정해주십시오";
                tutorialBox.style.display = 'none'; // 게임 시작하면 튜토리얼 숨기기
                startButtons.style.display = 'none';
                nextButtons.style.display = 'none';
            } else if (phase === 'betting') {
                statusTitle.innerText = currentMode === 'betting' ? "칩을 걸고 총합을 예측하십시오" : "모든 플레이어의 손가락 총합을 예측하십시오";
                tutorialBox.style.display = 'none';
            }
            
            if (players) renderPlayers(players);
        });

        socket.on('revealResult', (data) => {
            currentPhase = 'reveal';
            statusTitle.innerText = "결과 공개";
            currentMode = data.roundMode;
            
            renderPlayers(data.players, data.trueTotal);
            
            trueTotalDisplay.innerHTML = `TOTAL : ${data.trueTotal}`;
            trueTotalDisplay.style.display = 'block';
            
            setTimeout(() => { 
                nextButtons.style.display = 'flex'; 
            }, 4000);
        });

        window.startGame = function(mode) {
            if (playerBoard.children.length === 0) {
                alert("입장한 플레이어가 없습니다!\n최소 1명 이상 접속한 후에 시작해주세요.");
                return;
            }
            socket.emit('startGame', mode);
        }

        window.nextRound = function() {
            socket.emit('nextRound');
        }

        window.endGame = function() {
            if(confirm("게임을 완전히 종료하고 모드 선택 화면으로 돌아가시겠습니까?\n(모든 점수가 초기화됩니다)")) {
                socket.emit('endGame');
            }
        }
    </script>
</body>
</html>
